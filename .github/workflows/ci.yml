name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy env values so Next.js can statically analyse without secrets.
      # Real secrets live in GitHub Environments + Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      JWT_SECRET: ci-jwt-secret-please-replace-with-64-hex-chars-in-production
      CRON_SECRET: ci-cron-secret
      EMAIL_USER: ci@example.com
      EMAIL_PASS: ci-password
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0 || npm run lint

      - name: Unit + integration tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      JWT_SECRET: ci-jwt-secret-please-replace-with-64-hex-chars-in-production
      CRON_SECRET: ci-cron-secret
      EMAIL_USER: ci@example.com
      EMAIL_PASS: ci-password
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      PLAYWRIGHT_PORT: '3100'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
